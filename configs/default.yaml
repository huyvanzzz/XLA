image_size: 416
epochs: 20
batch_size: 12
lr: 0.001
weight_decay: 0.0001
num_workers: 2
seed: 42
amp: true
warmup_epochs: 3
label_smoothing: 0.03

anchors:
  - [16.0, 24.0]
  - [32.0, 48.0]
  - [64.0, 96.0]
  - [128.0, 160.0]
  - [220.0, 260.0]

loss_weights:
  box_weight: 7.5
  obj_weight: 1.0
  noobj_weight: 0.35
  cls_weight: 1.0
  iou_weight: 1.5

inference:
  conf_threshold: 0.2
  nms_threshold: 0.5
  max_detections: 100
