image_size: 416
epochs: 80
batch_size: 24
lr: 0.001
weight_decay: 0.0001
num_workers: 2
seed: 42
amp: true
warmup_epochs: 3
label_smoothing: 0.03
freeze_backbone_epochs: 3
early_stopping_patience: 15

augmentation:
  random_crop_prob: 0.35
  min_crop_scale: 0.75
  random_scale_prob: 0.35
  min_scale: 0.75
  max_scale: 1.25

model:
  backbone: resnet50
  pretrained: true
  base_channels: 40
  head_channels: 256
  dropout: 0.05
  elan_depth: 2
  aux_head: true

anchors:
  - [[10.0, 13.0], [16.0, 24.0], [32.0, 32.0]]
  - [[32.0, 48.0], [64.0, 96.0], [96.0, 128.0]]
  - [[128.0, 160.0], [220.0, 260.0], [320.0, 320.0]]

loss_weights:
  box_weight: 7.5
  obj_weight: 1.0
  noobj_weight: 0.35
  cls_weight: 1.0
  iou_weight: 1.5
  aux_weight: 0.4

inference:
  conf_threshold: 0.2
  nms_threshold: 0.5
  max_detections: 100

ema:
  enabled: true
  decay: 0.999
