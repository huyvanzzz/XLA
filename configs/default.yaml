image_size: 416
epochs: 80
batch_size: 24
lr: 0.001
weight_decay: 0.0001
num_workers: 2
seed: 42
amp: true
warmup_epochs: 3
label_smoothing: 0.03
freeze_backbone_epochs: 3
early_stopping_patience: 15

augmentation:
  random_crop_prob: 0.35
  min_crop_scale: 0.75
  random_scale_prob: 0.35
  min_scale: 0.75
  max_scale: 1.25

model:
  backbone: resnet34
  pretrained: true
  base_channels: 48
  head_channels: 384
  dropout: 0.08
  residual_blocks:
    stage2: 1
    stage3: 3
    stage4: 4

anchors:
  - [16.0, 24.0]
  - [32.0, 48.0]
  - [64.0, 96.0]
  - [128.0, 160.0]
  - [220.0, 260.0]

loss_weights:
  box_weight: 7.5
  obj_weight: 1.0
  noobj_weight: 0.35
  cls_weight: 1.0
  iou_weight: 1.5

inference:
  conf_threshold: 0.2
  nms_threshold: 0.5
  max_detections: 100

ema:
  enabled: true
  decay: 0.999
