image_size: 512
multi_scale:
  enabled: true
  sizes: [416, 448, 480, 512, 544]
epochs: 80
batch_size: 16
lr: 0.0001
weight_decay: 0.0005
num_workers: 2
seed: 42
amp: true
warmup_epochs: 3
label_smoothing: 0.05
freeze_backbone_epochs: 2
early_stopping_patience: 20

augmentation:
  random_crop_prob: 0.2
  min_crop_scale: 0.8
  random_scale_prob: 0.45
  min_scale: 0.75
  max_scale: 1.25

model:
  backbone: resnet50
  pretrained: true
  base_channels: 40
  head_channels: 256
  neck_channels: 256
  attention_heads: 4
  dropout: 0.1
  elan_depth: 2
  aux_head: true

anchors:
  auto: true
  kmeans_iters: 40
  per_scale: 3
  values:
  - [[10.0, 13.0], [16.0, 24.0], [32.0, 32.0]]
  - [[32.0, 48.0], [64.0, 96.0], [96.0, 128.0]]
  - [[128.0, 160.0], [220.0, 260.0], [320.0, 320.0]]

class_weights:
  enabled: true

loss_weights:
  box_weight: 8.0
  obj_weight: 1.0
  noobj_weight: 0.25
  cls_weight: 1.0
  iou_weight: 2.0
  aux_weight: 0.4
  objectness_focal_gamma: 1.5
  iou_aware_objectness: true
  positive_anchor_topk: 3

inference:
  conf_threshold: 0.08
  nms_threshold: 0.5
  nms_type: hard
  max_detections: 100
  pre_nms_topk: 300

validation_metric:
  enabled: true
  every: 5
  conf_threshold: 0.08
  nms_threshold: 0.5
  nms_type: hard
  pre_nms_topk: 300
  tune: false
  tune_every: 10
  conf_thresholds: [0.05, 0.08, 0.12]
  nms_thresholds: [0.5]

ema:
  enabled: true
  decay: 0.999
